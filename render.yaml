services:
  - type: web
    name: rag-chatbot
    runtime: go
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: EMBED_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Only needed for rollback (EMBED_PROVIDER=voyage / LLM_PROVIDER=gemini).
      - key: VOYAGE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: "8080"
      - key: SIMILARITY_THRESHOLD
        value: "0.75"
